name: business-pulse
services:
  pulse:
    build: .
    image: business-pulse-pulse
    ports:
      - "127.0.0.1:${PULSE_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - pulse-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 20s
volumes:
  pulse-data:
